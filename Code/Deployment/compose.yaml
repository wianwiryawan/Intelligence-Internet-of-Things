services:
  hivemq:
    image: hivemq/hivemq4:latest
    container_name: hivemq
    restart: unless-stopped

    ports:
      - "8080:8080"
      - "1883:1883"

    environment:
      HIVEMQ_LOG_BASED_CLUSTERING_ENABLED: "true"
      HIVEMQ_LICENSE_KEY: "${HIVEMQ_LICENSE_KEY}"

    networks:
      - iot-network
  
  node-red:
    image: nodered/node-red:latest
    container_name: mynodered
    restart: unless-stopped

    ports:
      - "1880:1880"

    environment:
      TZ: Asia/Jakarta
      FLOWS: flows.json

    volumes:
      - node_red_data:/data

    depends_on:
      - hivemq

    networks:
      - iot-network

volumes:
  node_red_data:
    external: true

networks:
  iot-network:
    external: true
